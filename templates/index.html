<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#FAF0E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Etiquetas Falantes — Buinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ASAP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --creme: #FAF0E1;
  --azul: #2038A6;
  --azul-light: #EEF1FA;
  --azul-mid: #6478C8;
  --laranja: #FA6415;
  --laranja-light: #FEF0E8;
  --text-dark: #1A1A2E;
  --text-mid: #4A4A6A;
  --text-light: #8888AA;
  --white: #FFFFFF;
  --success: #2E7D5E;
  --success-bg: #E8F5EE;
  --danger: #C0392B;
  --danger-bg: #FDEDEB;
  --border: rgba(32,56,166,0.12);
  --shadow: 0 2px 12px rgba(32,56,166,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { font-size: 16px; }

body {
  font-family: 'ASAP', sans-serif;
  background: var(--creme);
  color: var(--text-dark);
  min-height: 100vh;
  max-width: 420px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}

/* ─── HEADER ─── */
.app-header {
  background: var(--azul);
  color: var(--white);
  padding: 1rem 1.25rem 1rem;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-shape {
  width: 36px; height: 36px;
  background: var(--laranja);
  border-radius: 8px 8px 8px 0;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.logo-shape svg { width: 22px; height: 22px; fill: white; }

.header-text h1 {
  font-size: 15px; font-weight: 700; line-height: 1.1;
  letter-spacing: 0.01em;
}
.header-text p {
  font-size: 11px; opacity: 0.72; font-weight: 400; margin-top: 1px;
}

/* ─── STATUS BANNER ─── */
#status-banner {
  margin: 1rem 1rem 0;
  padding: .875rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.3s ease;
  min-height: 52px;
}

#status-banner.idle    { background: var(--azul-light); color: var(--azul); }
#status-banner.success { background: var(--success-bg); color: var(--success); }
#status-banner.danger  { background: var(--danger-bg);  color: var(--danger); }
#status-banner.warn    { background: #FFF8E1; color: #8B6914; }
#status-banner.recording { background: #FDE8E8; color: var(--danger); animation: pulse-bg 1.2s infinite; }

@keyframes pulse-bg {
  0%,100% { background: #FDE8E8; }
  50%      { background: #FBCFCF; }
}

.status-icon {
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.idle    .status-icon { background: var(--azul);    color: white; }
.success .status-icon { background: var(--success); color: white; }
.danger  .status-icon { background: var(--danger);  color: white; }
.warn    .status-icon { background: #E8A91A;        color: white; }
.recording .status-icon { background: var(--danger); color: white; }

/* ─── MAIN ACTION AREA ─── */
.main-actions {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
}

.action-btn {
  width: 100%;
  min-height: 80px;
  border: none;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 1rem 1.25rem;
  cursor: pointer;
  font-family: 'ASAP', sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  position: relative;
  overflow: hidden;
}

.action-btn:active { transform: scale(0.97); }
.action-btn:focus-visible {
  outline: 3px solid var(--laranja);
  outline-offset: 2px;
}

.action-btn .btn-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 26px;
}

.action-btn .btn-text { flex: 1; }
.action-btn .btn-title { display: block; font-size: 17px; font-weight: 700; }
.action-btn .btn-sub   { display: block; font-size: 12px; margin-top: 2px; font-weight: 400; }

/* Scan button — azul principal */
#btn-scan {
  background: var(--azul);
  color: var(--white);
  box-shadow: 0 4px 16px rgba(32,56,166,0.28);
}
#btn-scan .btn-icon { background: rgba(255,255,255,0.18); }
#btn-scan .btn-sub  { opacity: 0.72; }

/* Record button — laranja */
#btn-record {
  background: var(--laranja);
  color: var(--white);
  box-shadow: 0 4px 16px rgba(250,100,21,0.28);
}
#btn-record .btn-icon { background: rgba(255,255,255,0.18); }
#btn-record .btn-sub  { opacity: 0.72; }

/* Stop button — danger */
#btn-stop {
  background: var(--danger);
  color: var(--white);
  box-shadow: 0 4px 16px rgba(192,57,43,0.28);
  display: none;
}
#btn-stop .btn-icon { background: rgba(255,255,255,0.18); }
#btn-stop .btn-sub  { opacity: 0.72; }

/* Manage button — outline style */
#btn-manage {
  background: var(--white);
  color: var(--azul);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
}
#btn-manage .btn-icon { background: var(--azul-light); }
#btn-manage .btn-sub  { color: var(--text-mid); }

/* ─── RECORDING INDICATOR ─── */
#recording-indicator {
  display: none;
  margin: 0 1rem;
  padding: .875rem 1rem;
  background: var(--danger-bg);
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--danger);
  align-items: center;
  gap: 12px;
}
#recording-indicator.active { display: flex; }

.rec-dot {
  width: 12px; height: 12px;
  background: var(--danger);
  border-radius: 50%;
  animation: blink 1s infinite;
  flex-shrink: 0;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

#rec-timer {
  font-size: 22px;
  font-weight: 700;
  color: var(--danger);
  font-variant-numeric: tabular-nums;
  flex: 1;
  text-align: right;
}

/* ─── WAVEFORM ─── */
#waveform-container {
  display: none;
  margin: 0 1rem;
  background: var(--white);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  padding: .5rem;
  height: 60px;
  align-items: center;
}
#waveform-container.active { display: flex; }
#waveform { width: 100%; height: 44px; }

/* ─── TAG LIST PANEL ─── */
#tag-panel {
  display: none;
  margin: .75rem 1rem 0;
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
}
#tag-panel.open { display: block; }

.panel-header {
  background: var(--azul-light);
  padding: .75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-header h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--azul);
}
.panel-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: var(--azul);
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.panel-close:hover { background: var(--border); }

#tag-list { list-style: none; }

.tag-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: .875rem 1rem;
  border-bottom: .5px solid var(--border);
  transition: background 0.1s;
}
.tag-item:last-child { border-bottom: none; }
.tag-item:hover { background: var(--creme); }

.tag-color {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.tag-info { flex: 1; min-width: 0; }
.tag-name {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tag-uid {
  font-size: 11px; color: var(--text-light);
  font-family: monospace;
  margin-top: 1px;
}
.tag-duration {
  font-size: 12px; color: var(--text-mid);
  margin-top: 2px;
}

.tag-actions { display: flex; gap: 6px; }
.tag-btn {
  width: 36px; height: 36px;
  border: none; border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background 0.1s, transform 0.1s;
}
.tag-btn:active { transform: scale(0.92); }
.tag-btn.play { background: var(--azul-light); color: var(--azul); }
.tag-btn.del  { background: var(--danger-bg);  color: var(--danger); }

.empty-state {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--text-light);
  font-size: 14px;
}
.empty-state .empty-icon { font-size: 36px; display: block; margin-bottom: .5rem; }

/* ─── NFC ANIMATION ─── */
.nfc-anim-wrap {
  display: none;
  justify-content: center;
  padding: 1.5rem 1rem .5rem;
}
.nfc-anim-wrap.active { display: flex; }

.nfc-circle {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--azul-light);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.nfc-circle svg { width: 40px; height: 40px; fill: var(--azul); }
.nfc-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--azul);
  opacity: 0;
  animation: nfc-expand 1.8s infinite;
}
.nfc-ring:nth-child(1) { width: 80px;  height: 80px;  animation-delay: 0s; }
.nfc-ring:nth-child(2) { width: 110px; height: 110px; animation-delay: 0.6s; }
.nfc-ring:nth-child(3) { width: 140px; height: 140px; animation-delay: 1.2s; }

@keyframes nfc-expand {
  0%   { opacity: 0.7; transform: scale(0.85); }
  100% { opacity: 0;   transform: scale(1.3); }
}

/* ─── MODAL (name recording) ─── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,20,60,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--white);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.25rem 2rem;
  width: 100%; max-width: 420px;
  animation: slide-up 0.25s ease;
}
@keyframes slide-up {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-sheet h3 {
  font-size: 17px; font-weight: 700;
  color: var(--azul);
  margin-bottom: 1rem;
}

.modal-sheet label {
  display: block;
  font-size: 13px; font-weight: 600;
  color: var(--text-mid);
  margin-bottom: .4rem;
}

.modal-sheet input {
  width: 100%;
  padding: .75rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'ASAP', sans-serif;
  font-size: 16px;
  color: var(--text-dark);
  background: var(--creme);
  outline: none;
  transition: border-color 0.15s;
}
.modal-sheet input:focus { border-color: var(--azul); }

.modal-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: .75rem; margin-top: 1.25rem;
}
.modal-btn {
  padding: .875rem;
  border-radius: var(--radius-sm);
  border: none;
  font-family: 'ASAP', sans-serif;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s;
}
.modal-btn:active { transform: scale(0.96); }
.modal-btn.primary { background: var(--azul); color: var(--white); }
.modal-btn.secondary { background: var(--azul-light); color: var(--azul); }

/* ─── NFC DEMO SIMULATOR ─── */
.demo-bar {
  margin: .75rem 1rem 1rem;
  padding: .75rem 1rem;
  background: var(--laranja-light);
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--laranja);
  font-size: 12px;
  color: #7A3010;
}
.demo-bar strong { font-weight: 700; }
.demo-tags {
  display: flex; gap: 6px; margin-top: .5rem; flex-wrap: wrap;
}
.demo-tag-btn {
  padding: 4px 10px;
  background: var(--laranja);
  color: white;
  border: none;
  border-radius: 20px;
  font-family: 'ASAP', sans-serif;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
}

/* ─── FOOTER ─── */
.app-footer {
  padding: 1rem;
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  margin-top: .5rem;
}

/* ─── ARIA live region ─── */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; overflow: hidden; clip: rect(0,0,0,0);
  white-space: nowrap; border: 0;
}
</style>
</head>
<body>

<!-- Screen-reader live region -->
<div id="sr-announce" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

<!-- HEADER -->
<header class="app-header" role="banner">
  <div class="logo-shape" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 7 3 12s4 9 9 9 9-4 9-9-4-9-9-9zm0 4a2 2 0 110 4 2 2 0 010-4zm0 10c-2.67 0-5-1.33-5-2.67 0-.83 1-1.58 2.4-2 .46.52 1.1.84 1.6 1 .3.1.65.17 1 .17s.7-.07 1-.17c.5-.16 1.14-.48 1.6-1C17 13.75 18 14.5 18 15.33 18 16.67 15.67 18 13 18h-1z"/></svg>
  </div>
  <div class="header-text">
    <h1>Etiquetas Falantes</h1>
    <p>Buinho Educativo · NFC</p>
  </div>
</header>

<!-- STATUS -->
<div id="status-banner" class="idle" role="status" aria-live="polite">
  <div class="status-icon" aria-hidden="true">📡</div>
  <span id="status-text">Pronto. Escolhe uma acção.</span>
</div>

<!-- NFC ANIMATION -->
<div class="nfc-anim-wrap" id="nfc-anim" aria-hidden="true">
  <div class="nfc-circle">
    <div class="nfc-ring"></div>
    <div class="nfc-ring"></div>
    <div class="nfc-ring"></div>
    <svg viewBox="0 0 24 24"><path d="M20.57 3.43A9.94 9.94 0 0112 2C6.47 2 2 6.47 2 12a9.94 9.94 0 001.43 5.13L2 22l4.87-1.43A9.94 9.94 0 0012 22c5.53 0 10-4.47 10-10a9.94 9.94 0 00-1.43-5.57zM12 20c-1.41 0-2.75-.37-3.92-1.01l-.28-.17-2.9.76.77-2.83-.18-.29A7.94 7.94 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
  </div>
</div>

<!-- RECORDING INDICATOR -->
<div id="recording-indicator" role="timer" aria-label="Tempo de gravação">
  <div class="rec-dot" aria-hidden="true"></div>
  <span style="font-size:14px;font-weight:600;color:var(--danger);flex:1">A gravar...</span>
  <span id="rec-timer">0:00</span>
</div>

<!-- WAVEFORM -->
<div id="waveform-container" aria-hidden="true">
  <canvas id="waveform"></canvas>
</div>

<!-- DEMO BAR (only shown when NFC not available) -->
<div class="demo-bar" id="demo-bar" role="note" aria-label="Modo de demonstração">
  <strong>⚠ Modo demonstração</strong> — NFC não disponível neste browser/dispositivo.<br>
  Simula leitura de tag:
  <div class="demo-tags" id="demo-tags"></div>
</div>

<!-- MAIN ACTIONS -->
<main class="main-actions" role="main">
  <button class="action-btn" id="btn-scan"
    aria-label="Ler etiqueta NFC. Aproxima o telemóvel da etiqueta."
    aria-describedby="status-text">
    <div class="btn-icon" aria-hidden="true">📡</div>
    <div class="btn-text">
      <span class="btn-title">Ler etiqueta</span>
      <span class="btn-sub">Aproxima o telemóvel da etiqueta NFC</span>
    </div>
  </button>

  <button class="action-btn" id="btn-record"
    aria-label="Gravar mensagem de voz para nova etiqueta"
    aria-describedby="status-text">
    <div class="btn-icon" aria-hidden="true">🎙</div>
    <div class="btn-text">
      <span class="btn-title">Gravar mensagem</span>
      <span class="btn-sub">Grava a tua voz e associa a uma etiqueta</span>
    </div>
  </button>

  <button class="action-btn" id="btn-stop"
    aria-label="Parar gravação"
    style="display:none">
    <div class="btn-icon" aria-hidden="true">⏹</div>
    <div class="btn-text">
      <span class="btn-title">Parar gravação</span>
      <span class="btn-sub">Toca aqui para terminar</span>
    </div>
  </button>

  <button class="action-btn" id="btn-manage"
    aria-label="Gerir etiquetas guardadas. Ver lista de gravações."
    aria-expanded="false"
    aria-controls="tag-panel">
    <div class="btn-icon" aria-hidden="true">📋</div>
    <div class="btn-text">
      <span class="btn-title">Gerir etiquetas</span>
      <span class="btn-sub" id="tag-count-label">0 etiquetas guardadas</span>
    </div>
  </button>
</main>

<!-- TAG LIST PANEL -->
<section id="tag-panel" aria-label="Lista de etiquetas guardadas" aria-hidden="true">
  <div class="panel-header">
    <h2>Etiquetas guardadas</h2>
    <button class="panel-close" id="panel-close-btn" aria-label="Fechar painel">✕</button>
  </div>
  <ul id="tag-list" role="list" aria-label="Etiquetas de voz"></ul>
</section>

<!-- FOOTER -->
<footer class="app-footer" role="contentinfo">
  Buinho Educativo · Protótipo NFC v0.1
</footer>

<!-- MODAL: nomear gravação -->
<div class="modal-overlay" id="modal-name" role="dialog"
  aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
  <div class="modal-sheet">
    <h3 id="modal-title">Nomear a etiqueta</h3>
    <label for="input-tag-name">Nome ou descrição do objecto</label>
    <input type="text" id="input-tag-name"
      placeholder="ex: Caixa de cereais, Porta da sala..."
      autocomplete="off" maxlength="60">
    <div class="modal-actions">
      <button class="modal-btn secondary" id="modal-cancel">Cancelar</button>
      <button class="modal-btn primary" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ─── UTILS ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const announce = txt => { $('sr-announce').textContent = ''; setTimeout(() => $('sr-announce').textContent = txt, 50); };

function setStatus(type, icon, text) {
  const b = $('status-banner');
  b.className = type;
  b.querySelector('.status-icon').textContent = icon;
  $('status-text').textContent = text;
  announce(text);
}

// ─── INDEXEDDB ───────────────────────────────────────────
let db;
const DB_NAME = 'EtiquetasFalantes', DB_VER = 1, STORE = 'tags';

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE, { keyPath: 'uid' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

function dbPut(record)    { return new Promise((r,j)=>{ const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(record); t.onsuccess=r; t.onerror=j; }); }
function dbGet(uid)       { return new Promise((r,j)=>{ const t=db.transaction(STORE,'readonly').objectStore(STORE).get(uid); t.onsuccess=e=>r(e.target.result); t.onerror=j; }); }
function dbGetAll()       { return new Promise((r,j)=>{ const t=db.transaction(STORE,'readonly').objectStore(STORE).getAll(); t.onsuccess=e=>r(e.target.result); t.onerror=j; }); }
function dbDelete(uid)    { return new Promise((r,j)=>{ const t=db.transaction(STORE,'readwrite').objectStore(STORE).delete(uid); t.onsuccess=r; t.onerror=j; }); }

// ─── STATE ───────────────────────────────────────────────
let state = 'idle'; // idle | scanning | recording | naming
let mediaRecorder, audioChunks = [], recInterval, recSeconds = 0;
let pendingBlob = null, pendingUID = null;
let hasNFC = ('NDEFReader' in window);
let nfcController = null;
let animCtx, animFrame;

// ─── DEMO MODE ───────────────────────────────────────────
const DEMO_TAGS = [
  { uid: 'DEMO-UID-001', label: 'Frasco 1' },
  { uid: 'DEMO-UID-002', label: 'Frasco 2' },
  { uid: 'DEMO-UID-003', label: 'Porta' },
];

function setupDemoBar() {
  const bar = $('demo-bar');
  const container = $('demo-tags');
  if (hasNFC) { bar.style.display = 'none'; return; }
  DEMO_TAGS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'demo-tag-btn';
    btn.textContent = '📶 ' + t.label;
    btn.setAttribute('aria-label', 'Simular leitura da tag: ' + t.label);
    btn.onclick = () => simulateTagRead(t.uid);
    container.appendChild(btn);
  });
}

function simulateTagRead(uid) {
  if (state === 'recording') { setStatus('warn','⚠','Para a gravação primeiro.'); return; }
  handleTagUID(uid);
}

// ─── NFC ─────────────────────────────────────────────────
async function startScan() {
  if (!hasNFC) { setStatus('warn','⚠','NFC não disponível. Usa os botões de demonstração.'); return; }
  try {
    if (nfcController) nfcController.abort();
    nfcController = new AbortController();
    const ndef = new NDEFReader();
    setStatus('idle','📡','À espera de etiqueta NFC...');
    showNFCAnim(true);
    await ndef.scan({ signal: nfcController.signal });
    ndef.onreading = e => {
      showNFCAnim(false);
      handleTagUID(e.serialNumber || 'UID-' + Date.now());
    };
    ndef.onerror = () => setStatus('danger','❌','Erro ao ler NFC.');
  } catch(err) {
    showNFCAnim(false);
    if (err.name === 'NotAllowedError') setStatus('danger','❌','Permissão NFC negada.');
    else setStatus('danger','❌','Erro: ' + err.message);
  }
}

function showNFCAnim(on) {
  $('nfc-anim').classList.toggle('active', on);
}

// ─── TAG READ HANDLER ────────────────────────────────────
async function handleTagUID(uid) {
  if (state === 'naming') return;

  if (state === 'recording') {
    // Associate recording with this tag
    pendingUID = uid;
    stopRecording();
    return;
  }

  // Try to find existing recording
  const record = await dbGet(uid);
  if (record && record.audioBlob) {
    playAudio(record.audioBlob, record.name || uid);
  } else {
    setStatus('warn','🏷','Etiqueta nova! Grava uma mensagem para ela.');
    announce('Etiqueta nova detectada. Grava uma mensagem para associar.');
  }
}

// ─── AUDIO PLAYBACK ──────────────────────────────────────
function playAudio(blob, name) {
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  setStatus('success','▶️','A reproduzir: ' + name);
  announce('A reproduzir: ' + name);
  audio.play();
  audio.onended = () => {
    setStatus('idle','📡','Pronto. Escolhe uma acção.');
    URL.revokeObjectURL(url);
  };
}

// ─── RECORDING ───────────────────────────────────────────
async function startRecording() {
  if (state === 'recording') return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state = 'recording';
    audioChunks = [];
    recSeconds = 0;
    updateRecTimer();

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => { stream.getTracks().forEach(t=>t.stop()); };
    mediaRecorder.start(100);

    recInterval = setInterval(() => { recSeconds++; updateRecTimer(); }, 1000);

    $('btn-record').style.display = 'none';
    $('btn-stop').style.display = '';
    $('recording-indicator').classList.add('active');

    startWaveform(stream);
    setStatus('recording','🔴','A gravar... (toca numa etiqueta NFC para associar)');
    announce('Gravação iniciada. Fala agora. Toca numa etiqueta para associar a gravação.');

    if (hasNFC) startScan();
  } catch(err) {
    setStatus('danger','❌','Microfone não disponível: ' + err.message);
  }
}

function updateRecTimer() {
  const m = Math.floor(recSeconds/60);
  const s = String(recSeconds%60).padStart(2,'0');
  $('rec-timer').textContent = m + ':' + s;
}

function stopRecording() {
  if (state !== 'recording') return;
  clearInterval(recInterval);
  stopWaveform();

  mediaRecorder.stop();
  mediaRecorder.onstop = () => {
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    pendingBlob = blob;
    if (pendingUID) {
      openNamingModal(pendingUID);
    } else {
      // No NFC — ask user to scan now or name manually
      openNamingModal('MANUAL-' + Date.now());
    }
  };

  $('btn-stop').style.display = 'none';
  $('btn-record').style.display = '';
  $('recording-indicator').classList.remove('active');
  $('waveform-container').classList.remove('active');
  state = 'naming';
}

// ─── WAVEFORM VISUALIZER ─────────────────────────────────
let analyser, waveData;
function startWaveform(stream) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 128;
  ctx.createMediaStreamSource(stream).connect(analyser);
  waveData = new Uint8Array(analyser.frequencyBinCount);
  $('waveform-container').classList.add('active');
  drawWave();
}
function drawWave() {
  const canvas = $('waveform');
  const ctx2 = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  analyser.getByteTimeDomainData(waveData);
  ctx2.clearRect(0,0,canvas.width,canvas.height);
  ctx2.strokeStyle = '#FA6415';
  ctx2.lineWidth = 2;
  ctx2.beginPath();
  const slice = canvas.width / waveData.length;
  let x = 0;
  waveData.forEach((v,i) => {
    const y = (v/128.0) * canvas.height/2;
    i===0 ? ctx2.moveTo(x,y) : ctx2.lineTo(x,y);
    x += slice;
  });
  ctx2.stroke();
  animFrame = requestAnimationFrame(drawWave);
}
function stopWaveform() {
  cancelAnimationFrame(animFrame);
  analyser = null;
}

// ─── NAMING MODAL ────────────────────────────────────────
function openNamingModal(uid) {
  pendingUID = uid;
  $('modal-name').classList.add('open');
  $('modal-name').setAttribute('aria-hidden','false');
  $('input-tag-name').value = '';
  setTimeout(() => $('input-tag-name').focus(), 100);
  setStatus('idle','✏️','Dá um nome a esta etiqueta.');
  announce('Gravação terminada. Dá um nome à etiqueta.');
}

function closeNamingModal() {
  $('modal-name').classList.remove('open');
  $('modal-name').setAttribute('aria-hidden','true');
  state = 'idle';
  pendingBlob = null;
  pendingUID = null;
  setStatus('idle','📡','Pronto. Escolhe uma acção.');
}

async function confirmNaming() {
  const name = $('input-tag-name').value.trim() || 'Etiqueta sem nome';
  if (!pendingBlob || !pendingUID) { closeNamingModal(); return; }
  const record = {
    uid: pendingUID,
    name: name,
    audioBlob: pendingBlob,
    createdAt: new Date().toISOString(),
    duration: recSeconds,
  };
  await dbPut(record);
  closeNamingModal();
  setStatus('success','✅','Gravação guardada: ' + name);
  announce('Gravação guardada com sucesso: ' + name);
  renderTagList();
  updateTagCount();
}

// ─── TAG LIST ────────────────────────────────────────────
const COLORS = ['#EEF1FA','#FEF0E8','#E8F5EE','#FFF8E1','#FDEDEB'];
const COLOR_ICONS = ['📦','🧴','🚪','🥫','📚','🎵','💊','🍵','🔑','🧴'];

async function renderTagList() {
  const list = $('tag-list');
  const tags = await dbGetAll();
  if (tags.length === 0) {
    list.innerHTML = '<li class="empty-state"><span class="empty-icon">🏷</span>Ainda não tens etiquetas guardadas.</li>';
    return;
  }
  list.innerHTML = '';
  tags.forEach((tag, i) => {
    const li = document.createElement('li');
    li.className = 'tag-item';
    li.setAttribute('role','listitem');
    const dur = tag.duration ? Math.floor(tag.duration) + 's' : '—';
    const col = COLORS[i % COLORS.length];
    const ico = COLOR_ICONS[i % COLOR_ICONS.length];
    li.innerHTML = `
      <div class="tag-color" style="background:${col}" aria-hidden="true">${ico}</div>
      <div class="tag-info">
        <div class="tag-name">${escHtml(tag.name)}</div>
        <div class="tag-uid">${escHtml(tag.uid.substring(0,16))}…</div>
        <div class="tag-duration">⏱ ${dur}</div>
      </div>
      <div class="tag-actions">
        <button class="tag-btn play" aria-label="Reproduzir ${escHtml(tag.name)}" data-uid="${escHtml(tag.uid)}">▶</button>
        <button class="tag-btn del"  aria-label="Apagar ${escHtml(tag.name)}" data-uid="${escHtml(tag.uid)}">🗑</button>
      </div>`;
    list.appendChild(li);
  });

  list.querySelectorAll('.tag-btn.play').forEach(btn => {
    btn.onclick = async () => {
      const r = await dbGet(btn.dataset.uid);
      if (r) playAudio(r.audioBlob, r.name);
    };
  });
  list.querySelectorAll('.tag-btn.del').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Apagar esta etiqueta?')) return;
      await dbDelete(btn.dataset.uid);
      announce('Etiqueta apagada.');
      renderTagList();
      updateTagCount();
    };
  });
}

async function updateTagCount() {
  const tags = await dbGetAll();
  const n = tags.length;
  $('tag-count-label').textContent = n + (n===1 ? ' etiqueta guardada' : ' etiquetas guardadas');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── PANEL TOGGLE ────────────────────────────────────────
function togglePanel(open) {
  const p = $('tag-panel');
  p.classList.toggle('open', open);
  p.setAttribute('aria-hidden', String(!open));
  $('btn-manage').setAttribute('aria-expanded', String(open));
  if (open) { renderTagList(); $('panel-close-btn').focus(); }
}

// ─── EVENT LISTENERS ─────────────────────────────────────
$('btn-scan').onclick    = () => { if(state==='idle') startScan(); };
$('btn-record').onclick  = () => { if(state==='idle') startRecording(); };
$('btn-stop').onclick    = () => { if(state==='recording') stopRecording(); };
$('btn-manage').onclick  = () => togglePanel(!$('tag-panel').classList.contains('open'));
$('panel-close-btn').onclick = () => togglePanel(false);
$('modal-cancel').onclick  = () => closeNamingModal();
$('modal-confirm').onclick = () => confirmNaming();
$('input-tag-name').onkeydown = e => { if(e.key==='Enter') confirmNaming(); };

// Close modal on overlay click
$('modal-name').onclick = e => { if(e.target===$('modal-name')) closeNamingModal(); };

// ─── INIT ────────────────────────────────────────────────
(async () => {
  await openDB();
  setupDemoBar();
  updateTagCount();
  if (!hasNFC) {
    setStatus('warn','⚠','Modo demonstração (NFC não disponível)');
  }
})();
</script>
